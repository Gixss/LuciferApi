<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LuciferAPI</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <h1>Lucifer<span>API</span></h1>
    <div class="auth-tabs">
      <button class="atab active" data-atab="login">Login</button>
      <button class="atab" data-atab="register">Daftar</button>
    </div>
    <form id="loginForm" class="auth-form">
      <input type="text" id="loginUser" placeholder="username" required>
      <input type="password" id="loginPass" placeholder="password" required>
      <button type="submit">Login</button>
      <p id="loginErr" class="auth-error"></p>
    </form>
    <form id="registerForm" class="auth-form hidden">
      <input type="text" id="regUser" placeholder="username" required>
      <input type="text" id="regName" placeholder="nama tampilan">
      <input type="password" id="regPass" placeholder="password min 6" required>
      <button type="submit">Daftar</button>
      <p id="regErr" class="auth-error"></p>
    </form>
  </div>
</div>

<div id="appShell" class="app-shell hidden">
  <aside class="sidebar">
    <h2>Lucifer<span>API</span></h2>
    <div class="sb-user">
      <div id="sbDisplay">-</div>
      <div id="sbHandle">@-</div>
      <button id="logoutBtn">Logout</button>
    </div>
    <nav>
      <a class="nav-item" data-tool="chat-global">Chat Global</a>
      <a class="nav-item" data-tool="chat-dm">Chat Pribadi</a>
      <a class="nav-item active" data-tool="tiktok">TikTok</a>
      <a class="nav-item" data-tool="youtube">YouTube</a>
      <a class="nav-item" data-tool="instagram">Instagram</a>
      <a class="nav-item" data-tool="snackvideo">SnackVideo</a>
      <a class="nav-item" data-tool="ff">Free Fire OB55</a>
      <a class="nav-item" data-tool="deob">Lua Deobfuscator</a>
      <a class="nav-item" data-tool="about">About</a>
    </nav>
  </aside>

  <main>
    <h1 id="pageTitle">TikTok</h1>

    <section class="tool-panel" id="tool-chat-global">
      <div class="chat-box">
        <div id="gMessages" class="chat-messages"></div>
        <div class="chat-input">
          <input id="gInput" placeholder="Tulis pesan...">
          <button id="gSend">Kirim</button>
        </div>
      </div>
    </section>

    <section class="tool-panel" id="tool-chat-dm">
      <div class="dm-container">
        <div id="dmList" class="dm-list"></div>
        <div class="dm-room">
          <div id="dmHead">Pilih kontak</div>
          <div id="dmMessages" class="chat-messages"></div>
          <div class="chat-input">
            <input id="dInput" placeholder="Tulis pesan...">
            <button id="dSend">Kirim</button>
          </div>
        </div>
      </div>
    </section>

    <section class="tool-panel active" id="tool-tiktok">
      <form class="input-form" data-platform="tiktok">
        <input type="url" placeholder="https://tiktok.com/..." required>
        <button type="submit">Ambil</button>
      </form>
      <div class="result hidden"></div>
    </section>

    <section class="tool-panel" id="tool-youtube">
      <form class="input-form" data-platform="youtube">
        <input type="url" placeholder="https://youtu.be/..." required>
        <button type="submit">Ambil</button>
      </form>
      <div class="result hidden"></div>
    </section>

    <section class="tool-panel" id="tool-instagram">
      <form class="input-form" data-platform="instagram">
        <input type="url" placeholder="https://instagram.com/reel/..." required>
        <button type="submit">Ambil</button>
      </form>
      <div class="result hidden"></div>
    </section>

    <section class="tool-panel" id="tool-snackvideo">
      <form class="input-form" data-platform="snackvideo">
        <input type="url" placeholder="https://s.snackvideo.com/..." required>
        <button type="submit">Ambil</button>
      </form>
      <div class="result hidden"></div>
    </section>

    <section class="tool-panel" id="tool-ff">
      <form class="input-form" data-platform="ff">
        <input type="text" id="ffUid" placeholder="UID" required>
        <select id="ffRegion">
          <option value="ID">ID</option>
          <option value="SG">SG</option>
          <option value="IND">IND</option>
          <option value="BR">BR</option>
          <option value="ME">ME</option>
        </select>
        <button type="submit">Cek</button>
      </form>
      <div class="result hidden"></div>
    </section>

    <section class="tool-panel" id="tool-deob">
      <textarea id="deobInput" placeholder="-- paste Lua obfuscated" rows="8"></textarea>
      <div class="btn-row">
        <button class="act-btn" data-action="deob">Deobfuscate</button>
      </div>
      <div class="result hidden"></div>
    </section>

    <section class="tool-panel" id="tool-about">
      <div class="about">
        <h2>LuciferAPI v6.3</h2>
        <p>Developer: <b>Gixss</b></p>
        <p>Kontak: <a href="https://wa.me/6282322985264" target="_blank">62 8**-****-5264</a></p>
      </div>
    </section>
  </main>
</div>

<script src="/app.js"></script>
</body>
</html>
